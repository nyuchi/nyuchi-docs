name = "nyuchi-docs-mcp"
main = "src/worker.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]
account_id = "125a2dfbc21f76a25c980609609e8218"
workers_dev = true

# Serve the MCP endpoint on the docs domain itself. The worker is also
# always reachable at nyuchi-docs-mcp.nyuchi.workers.dev/mcp — use that
# to isolate zone-level issues (see the agent-readiness skill).
routes = [
  { pattern = "docs.nyuchi.com/mcp*", zone_name = "nyuchi.com" }
]

[vars]
TOP_K = "5"
ALLOWED_ORIGINS = "https://docs.nyuchi.com,https://docs.bundu.org"
# The WorkOS **AuthKit issuer** — the OAuth 2.1 authorization server whose
# /.well-known/openid-configuration + /oauth2/jwks verify a caller's own
# bearer token (src/auth.ts); this worker never originates a login flow.
# It is NOT auth.mukoko.com (the WorkOS *auth API* host, which serves no
# authorization-server metadata), and neither api.nyuchi.com nor
# api.mukoko.com is WorkOS at all. Not a secret — an OIDC issuer URL is
# public by design — but keep it in sync with the same value the site
# worker uses. The pre-Aug-2026 value identity.nyuchi.com has no DNS
# record any more; do not restore it.
WORKOS_ISSUER = "https://accounts.mukoko.com"

# Same AI Search instance the Ask-AI tab uses — read tools ride the
# existing nyuchi-docs corpus; this worker adds no ingestion of its own.
[[ai_search]]
binding = "NYUCHI_DOCS"
instance_name = "nyuchi-docs"

[observability]
enabled = true

# MCP write tools: submit_feedback + queued raise_issue land here.
# Set the optional GITHUB_TOKEN secret (wrangler secret put GITHUB_TOKEN)
# to have raise_issue file real issues on nyuchi/nyuchi-docs.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "9c5af0b28d5c4706840c492b2e3f47e8"

# Secret (wrangler secret put INTERNAL_FETCH_KEY): shared with
# nyuchi-docs's site worker. Once this worker has verified a caller's own
# bearer token (WORKOS_ISSUER above), it sends this key on the internal
# fetch for read_page so that already-authorized read skips the site's
# browser OIDC flow. Any long random string; must match on both workers.
# Unset on either side = internal reads degrade to "always denied" rather
# than an open bypass.
