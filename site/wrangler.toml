name = "nyuchi-docs"
main = "src/worker/gate.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]
account_id = "125a2dfbc21f76a25c980609609e8218"

# Static assets from ./dist, bound as ASSETS so src/worker/gate.ts can
# fetch through to them. Gate covers `visibility: internal` pages behind
# a WorkOS OIDC login (scripts/generate-internal-paths.mjs bakes the list
# into src/worker/internal-paths.generated.ts at build time); everything
# else passes straight through, same as when this was assets-only.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Without this, Cloudflare serves a request straight from the asset
# router when its path matches a real file in ./dist — the gate's fetch
# handler never runs at all, since every `visibility: internal` page
# *is* a real file. run_worker_first forces every request through
# src/worker/gate.ts first; it calls env.ASSETS.fetch() itself once a
# request clears the gate (or isn't an internal path to begin with).
run_worker_first = true

[observability]
enabled = true

# Uses the shared "Nyuchi Internal Tools" WorkOS Connect app (same one
# other internal tools/MCP surfaces use), not a dedicated "Nyuchi Docs"
# app — client_01KVTX0V2K1VM3PSC0DJ9VZWTV, clientConfidentiality: Public,
# so there's no client secret (src/worker/gate.ts treats
# WORKOS_CLIENT_SECRET as optional for exactly this reason — PKCE is the
# whole story for a public client). Neither of these is sensitive: the
# client ID is exposed in the browser's redirect URL anyway, and an OIDC
# issuer is public by design. redirect_uri
# https://docs.nyuchi.com/oauth/callback is registered on that app.
[vars]
WORKOS_CLIENT_ID = "client_01KVTX0V2K1VM3PSC0DJ9VZWTV"
# accounts.mukoko.com is the WorkOS **AuthKit issuer** — the OAuth 2.1
# authorization server serving /.well-known/openid-configuration,
# /oauth2/authorize, /oauth2/token and /oauth2/jwks (what gate.ts calls).
# It is NOT auth.mukoko.com (the WorkOS *auth API* / JWKS-fetch host, which
# serves no authorization-server metadata), and neither api.nyuchi.com (the
# Nyuchi API gateway) nor api.mukoko.com (a separate gateway, still being
# built) is WorkOS at all. The pre-Aug-2026 value identity.nyuchi.com has no
# DNS record any more — do not restore it; a dead issuer makes every
# `visibility: internal` page unsignable-into.
WORKOS_ISSUER = "https://accounts.mukoko.com"

# Secret (wrangler secret put INTERNAL_FETCH_KEY): shared with
# nyuchi-docs-mcp-worker so it can read internal pages on behalf of a
# caller it has already authorized itself, bypassing the browser OIDC
# flow. Any long random string; must match on both workers.
