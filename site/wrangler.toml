name = "nyuchi-docs"
main = "src/worker/gate.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]
account_id = "125a2dfbc21f76a25c980609609e8218"

# Static assets from ./dist, bound as ASSETS so src/worker/gate.ts can
# fetch through to them. Gate covers `visibility: internal` pages behind
# a WorkOS OIDC login (scripts/generate-internal-paths.mjs bakes the list
# into src/worker/internal-paths.generated.ts at build time); everything
# else passes straight through, same as when this was assets-only.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true

# Secrets (wrangler secret put, not committed):
#   WORKOS_CLIENT_ID, WORKOS_CLIENT_SECRET, WORKOS_ISSUER — the "Nyuchi
#     Docs" WorkOS Connect OAuth Application, redirect URI
#     https://docs.nyuchi.com/oauth/callback registered in its dashboard.
#   INTERNAL_FETCH_KEY — shared with nyuchi-docs-mcp-worker so it can
#     read internal pages on behalf of a caller it has already
#     authorized itself, bypassing the browser OIDC flow. Any long
#     random string; must match on both workers.
