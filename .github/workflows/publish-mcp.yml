# Publishes the docs MCP server: @nyuchi/nyuchi-docs-mcp to npm, then the
# server record (server.json) to the official MCP registry
# (registry.modelcontextprotocol.io) using GitHub OIDC — no registry
# credentials needed for the io.github.nyuchi/* namespace.
#
# npm auth is TRUSTED PUBLISHING (OIDC, https://docs.npmjs.com/trusted-publishers),
# not a token. `npm publish` swaps the job's GitHub OIDC ID token
# (id-token: write) for a short-lived publish token for this one package. npm
# accepts it only from the trusted publisher configured on npmjs.com for
# @nyuchi/nyuchi-docs-mcp (GitHub Actions, org nyuchi, repo nyuchi-docs,
# workflow publish-mcp.yml, `npm publish` allowed), on a GitHub-hosted runner,
# from npm CLI 11.5.1+ on Node 22.14.0+. setup-node gets no registry-url, so no
# .npmrc placeholder token can stand in for a failed exchange: a misconfigured
# trusted publisher fails as ENEEDAUTH, not as a misleading 404. The repo is
# public, so npm adds provenance by itself (--provenance says so explicitly).
#
# First publish only: the NPM_TOKEN fallback. npm attaches a trusted publisher
# only to a package that already exists, so the very first version of a name
# npm has never had cannot go by OIDC. When npm answers E404 for the package
# name (and only then), the publish step gets the NPM_TOKEN secret and
# publishes with it, with a warning; for an existing package the secret is
# never passed to any step. After that first publish, configure the trusted
# publisher on npmjs.com and delete the secret.
#
# Keep the versions in nyuchi-docs-mcp/package.json and server.json in
# lockstep — this workflow refuses to publish if they drift.
#
# Trigger: publish a GitHub release (tag e.g. mcp-v0.1.0), or run
# manually via workflow_dispatch.
name: Publish MCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + mcp-publisher github-oidc

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      # No registry-url: the OIDC token must be npm's only credential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing needs npm CLI 11.5.1+ and Node 22.14.0+. Node 22's
      # bundled npm is 10.x, which has no OIDC exchange. Pinned exactly.
      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.log("::error::Node " + process.version + " is older than 22.14.0, which npm trusted publishing needs");
              process.exit(1);
            }'
          npm install -g npm@11.21.0
          echo "node $(node --version), npm $(npm --version)"

      - name: Check versions are in lockstep
        run: |
          PKG=$(node -p "require('./nyuchi-docs-mcp/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          echo "package=$PKG server.json=$SRV server.json.packages[0]=$SRVPKG"
          test "$PKG" = "$SRV" && test "$PKG" = "$SRVPKG"

      - name: Install + test
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nyuchi/nyuchi-docs-mcp test

      # Skip when this version is already on the registry so a re-run (e.g.
      # after a failed MCP-registry step) doesn't die on EPUBLISHCONFLICT
      # before reaching the registry publish. never_published is true only
      # when npm answers E404 for the package name itself.
      - name: Check npm
        id: npm_check
        working-directory: nyuchi-docs-mcp
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already published — skipping npm publish"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          if out=$(npm view "$PKG" name --json 2>&1); then
            echo "never_published=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<<"$out"; then
            echo "$PKG has never been published"
            echo "never_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "never_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        if: steps.npm_check.outputs.already_published != 'true'
        working-directory: nyuchi-docs-mcp
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-pack"
          rm -rf "$pack_dir" && mkdir -p "$pack_dir"
          pnpm pack --pack-destination "$pack_dir"
          echo "tarball=$(ls "$pack_dir"/*.tgz)" >> "$GITHUB_OUTPUT"

      # OIDC (trusted publishing). FIRST_PUBLISH_TOKEN is the NPM_TOKEN secret
      # only for a package npm has never had (see the header), else empty.
      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          FIRST_PUBLISH_TOKEN: ${{ steps.npm_check.outputs.never_published == 'true' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            echo "::warning::First publish of a never-published package, by NPM_TOKEN." \
              "Configure its trusted publisher on npmjs.com next, then delete the secret."
            npmrc="$RUNNER_TEMP/first-publish.npmrc"
            # The literal ${NODE_AUTH_TOKEN}: npm expands it, so the token is never written to disk.
            # shellcheck disable=SC2016
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
            NPM_CONFIG_USERCONFIG="$npmrc" NODE_AUTH_TOKEN="$FIRST_PUBLISH_TOKEN" \
              npm publish "$TARBALL" --access public --provenance
            rm -f "$npmrc"
          elif ! npm publish "$TARBALL" --access public --provenance; then
            echo "::error::npm publish failed. On ENEEDAUTH, 401 or 404, check the trusted publisher"
            echo "for @nyuchi/nyuchi-docs-mcp on npmjs.com (Settings > Trusted publishing): GitHub Actions,"
            echo "organization nyuchi, repository nyuchi-docs, workflow publish-mcp.yml, with npm publish"
            echo "allowed. A package npm has never had needs the NPM_TOKEN secret for its first publish."
            exit 1
          fi

      - name: Install mcp-publisher
        # Resolve the release asset via the API instead of guessing the
        # filename — the naming (x86_64 vs amd64) has drifted between
        # releases, and a 404 piped straight into tar fails with the
        # misleading "gzip: stdin: not in gzip format".
        run: |
          set -euo pipefail
          url=$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mcp-publisher_.*linux_(x86_64|amd64)\\.tar\\.gz$")) | .browser_download_url' \
            | head -n1)
          test -n "$url" || { echo "no linux mcp-publisher asset found in latest release"; exit 1; }
          echo "downloading $url"
          curl -sSfL "$url" -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
