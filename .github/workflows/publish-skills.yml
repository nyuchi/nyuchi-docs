# Publishes @nyuchi/nyuchi-docs-skills to npm on merge to main.
#
# The bundle is data-only (JSON + Markdown), so there is nothing to build,
# typecheck, or test. The gate is scripts/validate-skills.mjs, which is
# zero-dependency and offline — it runs before `pnpm install` so a malformed
# bundle fails in seconds and never reaches npm. It also enforces the
# public/internal split: a skill must not exist in both this package and
# .claude/skills/, because a duplicated skill drifts.
#
# The version-bump guard queries the npm registry first, so a merge that does
# not change nyuchi-docs-skills/package.json#version is a no-op. Bump the
# version or nothing ships.
#
# npm auth is TRUSTED PUBLISHING (OIDC, https://docs.npmjs.com/trusted-publishers),
# not a token: `npm publish` swaps the job's GitHub OIDC ID token
# (id-token: write) for a short-lived publish token for this one package. npm
# accepts it only from the trusted publisher configured on npmjs.com for
# @nyuchi/nyuchi-docs-skills (GitHub Actions, org nyuchi, repo nyuchi-docs,
# workflow publish-skills.yml, `npm publish` allowed), from npm CLI 11.5.1+ on
# Node 22.14.0+. pnpm packs, npm publishes the tarball (only the npm CLI does
# the OIDC exchange). setup-node gets no registry-url, so a failed exchange
# fails as ENEEDAUTH instead of falling back to a placeholder token. The
# package is already on npm, so it needs no token-based first publish
# (publish-mcp.yml has that fallback for a never-published package).
name: Publish skills

on:
  push:
    branches: [main]
    paths:
      - "nyuchi-docs-skills/**"
      - "scripts/validate-skills.mjs"
      - ".github/workflows/publish-skills.yml"
  workflow_dispatch:

concurrency:
  group: publish-skills
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      # No registry-url: the OIDC token must be npm's only credential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # Trusted publishing needs npm CLI 11.5.1+ and Node 22.14.0+. Node 22's
      # bundled npm is 10.x, which has no OIDC exchange. Pinned exactly.
      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.log("::error::Node " + process.version + " is older than 22.14.0, which npm trusted publishing needs");
              process.exit(1);
            }'
          npm install -g npm@11.21.0
          echo "node $(node --version), npm $(npm --version)"

      # Zero-dependency, offline — runs before install so a broken bundle
      # fails fast rather than after resolving the whole workspace.
      - name: Validate the skills bundle and the public/internal split
        run: node scripts/validate-skills.mjs

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if version is already on npm
        id: npm_check
        working-directory: nyuchi-docs-skills
        run: |
          v=$(node -p "require('./package.json').version")
          if curl -fsS "https://registry.npmjs.org/@nyuchi%2Fnyuchi-docs-skills/$v" >/dev/null 2>&1; then
            echo "@nyuchi/nyuchi-docs-skills@$v already on npm — skipping (re-run is a no-op)"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack with pnpm
        id: pack
        if: steps.npm_check.outputs.already_published != 'true'
        working-directory: nyuchi-docs-skills
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-pack"
          rm -rf "$pack_dir" && mkdir -p "$pack_dir"
          pnpm pack --pack-destination "$pack_dir"
          echo "tarball=$(ls "$pack_dir"/*.tgz)" >> "$GITHUB_OUTPUT"

      # OIDC (trusted publishing); there is no token.
      - name: Publish to npm (trusted publishing)
        if: steps.npm_check.outputs.already_published != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if ! npm publish "$TARBALL" --access public --provenance; then
            echo "::error::npm publish failed. On ENEEDAUTH, 401 or 404, check the trusted publisher"
            echo "for @nyuchi/nyuchi-docs-skills on npmjs.com (Settings > Trusted publishing): GitHub"
            echo "Actions, organization nyuchi, repository nyuchi-docs, workflow publish-skills.yml,"
            echo "with npm publish allowed."
            exit 1
          fi
