# One-off, owner-requested 2026-09-29: retire the MCP Registry entry
# io.github.nyuchi/mzizi-mcp. The server moved to io.github.mzizi-dev/mzizi-mcp,
# and the registry allows one server per remote URL, so the old entry must be
# marked deleted before the new one can claim https://mcp.mzizi.dev/mcp.
# Runs once on push to this branch; the file is removed afterwards.
name: Retire io.github.nyuchi/mzizi-mcp

on:
  push:
    branches: [claude/mzizi-skills-publishing-i1r02q]
    paths: [.github/workflows/retire-mzizi-mcp-registry-entry.yml]

permissions:
  contents: read
  id-token: write # OIDC for mcp-publisher

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Mark every version of io.github.nyuchi/mzizi-mcp deleted
        run: |
          ./mcp-publisher status --status deleted --all-versions \
            --message "Moved to io.github.mzizi-dev/mzizi-mcp" \
            io.github.nyuchi/mzizi-mcp
